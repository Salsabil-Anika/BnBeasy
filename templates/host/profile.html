{% extends "layouts/base.html" %}

{% block title %}Edit Profile | BnBeasy{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Edit Profile</h2>
            <p>Update your public host information</p>
        </div>

        <form method="POST" enctype="multipart/form-data">
            <div class="form-group" style="text-align: center; margin-bottom: 2rem;">
                <label for="profile-upload" style="cursor: pointer;">
                    {% if user.profile_image %}
                    <img src="{{ url_for('static', filename='uploads/' + user.profile_image) }}"
                        style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-color);">
                    {% else %}
                    <div
                        style="width: 100px; height: 100px; border-radius: 50%; background: var(--bg-color); display: flex; align-items: center; justify-content: center; margin: 0 auto; border: 2px dashed var(--border-color);">
                        <span style="font-size: 2rem; color: var(--text-muted);">📷</span>
                    </div>
                    {% endif %}
                    <p style="color: var(--primary-color); font-size: 0.9rem; margin-top: 0.5rem;">Change Photo</p>
                </label>
                <input type="file" name="profile_image" id="profile-upload" style="display: none;" accept="image/*">
            </div>

            <div class="form-group">
                <label
                    style="display: block; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.25rem;">Name</label>
                <input type="text" name="name" class="form-input" placeholder="Your Name"
                    value="{{ user.name if user.name else '' }}">
            </div>

            <div class="form-group">
                <label
                    style="display: block; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.25rem;">Bio</label>
                <input type="text" name="bio" class="form-input" placeholder="Bio: Tell guests about yourself"
                    value="{{ user.bio if user.bio else '' }}">
            </div>
            <div class="form-group">
                <input type="text" name="location" class="form-input" placeholder="Location: e.g. New York, NY"
                    value="{{ user.location if user.location else '' }}">
            </div>
            <button type="submit" class="btn">Save Profile</button>
        </form>
    </div>
</div>
{% endblock %}
