{% extends "layouts/base.html" %}

{% block title %}Register - BnBeasy{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Create Account</h2>
            <p>Join our community today</p>
        </div>

        {% if message %}
        <div
            style="background: rgba(239, 68, 68, 0.1); color: {{ 'var(--success-color)' if status == 'success' else 'var(--error-color)' }}; padding: 0.75rem; border-radius: var(--radius); margin-bottom: 1rem; text-align: center;">
            {{ message }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <input type="text" name="name" class="form-input" placeholder="Full Name" required>
            </div>
            <div class="form-group">
                <input type="email" name="email" class="form-input" placeholder="Email Address" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" class="form-input" placeholder="Password" required>
            </div>
            <div class="form-group">
                <select name="role" class="form-input" required>
                    <option value="" disabled selected>Select Role</option>
                    <option value="traveller">Traveller</option>
                    <option value="host">Host</option>
                </select>
            </div>
            <button type="submit" class="btn">Sign Up</button>
        </form>

        <a href="{{ url_for('auth.login') }}" class="toggle-link">
            Already have an account? Sign In
        </a>
    </div>
</div>
{% endblock %}
