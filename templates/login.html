{% extends "base.html" %}

{% block title %}Login - BnBeasy{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Please enter your details to sign in</p>
    </div>

    {% if error %}
    <div
      style="background: rgba(239, 68, 68, 0.1); color: var(--error-color); padding: 0.75rem; border-radius: var(--radius); margin-bottom: 1rem; text-align: center;">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <input type="email" name="email" class="form-input" placeholder="Email Address" required>
      </div>
      <div class="form-group">
        <input type="password" name="password" class="form-input" placeholder="Password" required>
      </div>
      <button type="submit" class="btn">Sign In</button>
    </form>

    <a href="{{ url_for('auth.register') }}" class="toggle-link">
      Don't have an account? Create one
    </a>
  </div>
</div>
{% endblock %}
