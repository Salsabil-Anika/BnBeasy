<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BnBeasy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>BnBeasy Smart Rental System</h1>
        <nav>
            <a href="/">Home</a> |
            <a href="/auth/login">Login</a> |
            <a href="/listing/">Listings</a>
        </nav>
    </header>
    <div class="card rounded-xl p-6 block">
                    <a href="{{ url_for('traveller_community.community_home') }}">
                        <div class="flex items-center space-x-4">
                            <div class="bg-teal-600 p-3 rounded-xl"></div>
                            <div>
                                <h2 class="text-xl font-bold text-white">Community Forum</h2>
                                <p class="text-gray-400">Discuss, share tips, and connect with other hosts and travelers.
                                </p>
                                <p class="text-gray-400">check 1
                                </p>
                            </div>
                        </div>
                    </a>
                </div>

    <!-- Quick Links: My Bookings -->
    <div class="card rounded-xl p-6 mt-6">
        <a href="{{ url_for('traveler_profiles.booking_history') }}">
            <div style="display:flex; align-items:center; gap:1rem;">
                <div style="width:48px; height:48px; background:#46e0c1; border-radius:8px;"></div>
                <div>
                    <h2 style="font-size:1.25rem; font-weight:700; color:#fff;">My Bookings</h2>
                    <p style="color:#9ca3af;">View or cancel your reservations</p>
                </div>
            </div>
        </a>
    </div>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 BnBeasy</p>
    </footer>
</body>
</html>
