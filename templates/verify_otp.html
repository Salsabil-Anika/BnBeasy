{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-center">Verify Your Email</h2>
    <p class="mb-4 text-center text-gray-600">Please enter the 6-digit OTP sent to your email.</p>
    
    {% if error %}
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
        {{ error }}
    </div>
    {% endif %}

    <form action="{{ url_for('auth.verify_otp') }}" method="POST">
        <div class="mb-4">
            <input type="text" name="otp" placeholder="Enter OTP" required maxlength="6"
                class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-center text-xl tracking-widest">
        </div>
        <button type="submit" 
            class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200">
            Verify
        </button>
    </form>
</div>
{% endblock %}
