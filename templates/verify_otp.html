{% extends "base.html" %}

{% block title %}Verify Email - BnBeasy{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Email Verification</h2>
            <p>Enter the 6-digit OTP sent to your email</p>
        </div>

        {% if message %}
        <div
            style="background: rgba(239, 68, 68, 0.1); color: {{ 'var(--success-color)' if status == 'success' else 'var(--error-color)' }}; padding: 0.75rem; border-radius: var(--radius); margin-bottom: 1rem; text-align: center;">
            {{ message }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <input type="text" name="otp" class="form-input" placeholder="Enter OTP" required maxlength="6" pattern="\d{6}">
            </div>
            <button type="submit" class="btn">Verify OTP</button>
        </form>

        <a href="{{ url_for('auth.register') }}" class="toggle-link">
            Back to Registration
        </a>
    </div>
</div>
{% endblock %}
